name: Nightly release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  release:
    name: Package and publish nightly
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: packages.lock.json

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.0'
          cache: false

      - name: Define nightly version
        id: release
        shell: bash
        run: |
          timestamp=$(date -u +'%Y-%m-%d-%H%M')
          version="nightly-${timestamp}-${GITHUB_RUN_ID}"
          {
            echo "version=$version"
            echo "archive=SEpedia-nightly.zip"
          } >> "$GITHUB_OUTPUT"

      - name: Assemble Workshop-ready package
        shell: bash
        run: |
          ./scripts/package.sh \
            --stage "$RUNNER_TEMP/package" \
            --archive "$GITHUB_WORKSPACE/artifacts/${{ steps.release.outputs.archive }}"

      - name: Publish GitHub nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARCHIVE: ${{ steps.release.outputs.archive }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          notes=$(cat <<EOF
          > [!WARNING]
          > This is an automated GitHub-only nightly build. It has not been published to Steam Workshop and may be unstable.

          Version: \`${RELEASE_VERSION}\`

          Built from commit [\`${GITHUB_SHA}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}).
          EOF
          )

          mapfile -t previous_tags < <(
            gh release list \
              --limit 100 \
              --json name,tagName \
              --jq '.[] | select(.name == "nightly") | .tagName'
          )

          gh release create "$RELEASE_VERSION" \
            "artifacts/${RELEASE_ARCHIVE}#Workshop-ready mod archive" \
            "artifacts/${RELEASE_ARCHIVE}.sha256#SHA-256 checksum" \
            --target "$GITHUB_SHA" \
            --title "nightly" \
            --notes "$notes" \
            --generate-notes \
            --latest=false

          for previous_tag in "${previous_tags[@]}"; do
            if [[ "$previous_tag" != "$RELEASE_VERSION" ]]; then
              gh release delete "$previous_tag" --cleanup-tag --yes
            fi
          done
