name: Nightly release

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  package:
    name: Package nightly
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      archive: ${{ steps.release.outputs.archive }}
      target_sha: ${{ steps.release.outputs.target_sha }}
      version: ${{ steps.release.outputs.version }}

    steps:
      - name: Check out pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: packages.lock.json

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.0'
          cache: false

      - name: Define nightly version
        id: release
        shell: bash
        run: |
          timestamp=$(date -u +'%Y-%m-%d-%H%M')
          version="nightly-${timestamp}-${GITHUB_RUN_ID}"
          {
            echo "version=$version"
            echo "archive=SEpedia-nightly.zip"
            echo "target_sha=$GITHUB_SHA"
          } >> "$GITHUB_OUTPUT"

      - name: Assemble Workshop-ready package
        shell: bash
        run: |
          ./scripts/package.sh \
            --stage "$RUNNER_TEMP/package" \
            --archive "$RUNNER_TEMP/release/${{ steps.release.outputs.archive }}"

      - name: Upload nightly handoff artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nightly-release-${{ github.run_id }}
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  github_release:
    name: Publish GitHub nightly release
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download nightly handoff artifact
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: nightly-release-${{ github.run_id }}
          path: ${{ runner.temp }}/release

      - name: Publish GitHub nightly release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARCHIVE: ${{ needs.package.outputs.archive }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
          TARGET_SHA: ${{ needs.package.outputs.target_sha }}
        shell: bash
        run: |
          cd -- "$RUNNER_TEMP/release"
          sha256sum --check "$RELEASE_ARCHIVE.sha256"

          retry() {
            local attempt
            for attempt in 1 2 3 4; do
              if "$@"; then
                return 0
              fi
              if [[ $attempt -lt 4 ]]; then
                echo "::warning::GitHub API request failed; retrying ($attempt/4)."
                sleep $((attempt * 5))
              fi
            done
            return 1
          }

          notes=$(cat <<EOF
          > [!WARNING]
          > This is an automated GitHub-only nightly build. It has not been published to Steam Workshop and may be unstable.

          Version: \`${RELEASE_VERSION}\`

          Built from commit [\`${GITHUB_SHA}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}).
          EOF
          )

          previous_tag_output=$(retry \
            gh release list \
              --limit 100 \
              --json name,tagName \
              --jq '.[] | select(.name == "nightly") | .tagName')
          previous_tags=()
          if [[ -n "$previous_tag_output" ]]; then
            mapfile -t previous_tags <<< "$previous_tag_output"
          fi

          ensure_draft_release() {
            local is_draft
            if is_draft=$(gh release view "$RELEASE_VERSION" --json isDraft --jq '.isDraft' 2>/dev/null); then
              [[ "$is_draft" == "true" || "$is_draft" == "false" ]]
              return
            fi
            gh release create "$RELEASE_VERSION" \
              --draft \
              --target "$TARGET_SHA" \
              --title "nightly" \
              --notes "$notes" \
              --generate-notes
          }

          upload_release_assets() {
            local is_draft
            is_draft=$(gh release view "$RELEASE_VERSION" --json isDraft --jq '.isDraft') || return
            if [[ "$is_draft" == "false" ]]; then
              return 0
            fi
            gh release upload "$RELEASE_VERSION" \
              "$RELEASE_ARCHIVE#Workshop-ready mod archive" \
              "$RELEASE_ARCHIVE.sha256#SHA-256 checksum" \
              --clobber
          }

          verify_release_assets() {
            local assets
            assets=$(gh release view "$RELEASE_VERSION" --json assets --jq '.assets[].name') || return
            grep -Fxq "$RELEASE_ARCHIVE" <<< "$assets" &&
              grep -Fxq "$RELEASE_ARCHIVE.sha256" <<< "$assets"
          }

          publish_release() {
            local is_draft
            is_draft=$(gh release view "$RELEASE_VERSION" --json isDraft --jq '.isDraft') || return
            if [[ "$is_draft" == "false" ]]; then
              return 0
            fi
            gh release edit "$RELEASE_VERSION" --draft=false --latest=false
          }

          retry ensure_draft_release
          retry upload_release_assets
          retry verify_release_assets
          retry publish_release

          for previous_tag in "${previous_tags[@]}"; do
            if [[ "$previous_tag" != "$RELEASE_VERSION" ]]; then
              if ! retry gh release delete "$previous_tag" --cleanup-tag --yes; then
                echo "::warning::Published the replacement but could not prune $previous_tag."
              fi
            fi
          done
