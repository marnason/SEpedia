name: Stable release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without a leading v, for example 1.0.0
        required: true
        type: string
      release_notes:
        description: Optional notes to prepend before the generated changelog
        required: false
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: stable-release
  cancel-in-progress: false

jobs:
  release:
    name: Package and publish stable release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out latest main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release inputs
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          WORKSHOP_URL: ${{ vars.STEAM_WORKSHOP_URL }}
        shell: bash
        run: |
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$'
          workshop_url='^https://steamcommunity\.com/sharedfiles/filedetails/\?id=[0-9]+(&.*)?$'
          [[ "$VERSION" =~ $semver ]] || {
            echo "Invalid semantic version: $VERSION" >&2
            exit 1
          }
          version_without_build=${VERSION%%+*}
          if [[ "$version_without_build" == *-* ]]; then
            prerelease=${version_without_build#*-}
            IFS='.' read -ra prerelease_identifiers <<< "$prerelease"
            for identifier in "${prerelease_identifiers[@]}"; do
              if [[ "$identifier" =~ ^[0-9]+$ && ${#identifier} -gt 1 && "$identifier" == 0* ]]; then
                echo "Invalid semantic version: numeric pre-release identifiers cannot have leading zeroes." >&2
                exit 1
              fi
            done
          fi
          [[ "$WORKSHOP_URL" =~ $workshop_url ]] || {
            echo "Repository variable STEAM_WORKSHOP_URL is missing or invalid." >&2
            exit 1
          }

          tag="v${VERSION}"
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag already exists: $tag" >&2
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists: $tag" >&2
            exit 1
          fi

          target_sha=$(git rev-parse HEAD)
          archive="SEpedia-${VERSION}.zip"
          {
            echo "tag=$tag"
            echo "target_sha=$target_sha"
            echo "archive=$archive"
          } >> "$GITHUB_OUTPUT"

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: packages.lock.json

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.0'
          cache: false

      - name: Assemble Workshop-ready package
        shell: bash
        run: |
          ./scripts/package.sh \
            --stage "$RUNNER_TEMP/package" \
            --archive "$GITHUB_WORKSPACE/artifacts/${{ steps.release.outputs.archive }}"

      - name: Create stable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARCHIVE: ${{ steps.release.outputs.archive }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ inputs.version }}
          TARGET_SHA: ${{ steps.release.outputs.target_sha }}
          WORKSHOP_URL: ${{ vars.STEAM_WORKSHOP_URL }}
        shell: bash
        run: |
          notes=$(cat <<EOF
          ## Install SEpedia from Steam Workshop

          **[Open the SEpedia Steam Workshop page](${WORKSHOP_URL})**

          Steam Workshop is the primary distribution location for stable releases. The attached ZIP is provided for manual installation and verification.
          EOF
          )
          if [[ -n "$RELEASE_NOTES" ]]; then
            notes="${notes}

          ## Release notes

          ${RELEASE_NOTES}"
          fi

          gh release create "$RELEASE_TAG" \
            "artifacts/${RELEASE_ARCHIVE}#Workshop-ready mod archive" \
            "artifacts/${RELEASE_ARCHIVE}.sha256#SHA-256 checksum" \
            --target "$TARGET_SHA" \
            --title "SEpedia ${RELEASE_VERSION}" \
            --notes "$notes" \
            --generate-notes \
            --latest
